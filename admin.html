<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Event Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 2rem; }
    input, button { padding: 0.5rem; font-size: 1rem; }
    ul { list-style-type: none; padding: 0; }
    li { background: #f4f4f4; padding: 0.75rem; margin-bottom: 0.5rem; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Add New Event</h2>
  
  <form id="eventForm" onsubmit="handleFormSubmit(event)">
    <input type="text" id="eventTitle" placeholder="Event Title" required />
    <input type="date" id="eventDate" required />
    <button type="submit">Append Event</button>
  </form>

  <h2>Event Log</h2>
  <ul id="eventList"></ul>

  <script>
    // 1. Safe state initialization (Prevents 'undefined' errors)
    function getAdminData() {
      const stored = localStorage.getItem('adminData');
      let data = null;

      try {
        data = stored ? JSON.parse(stored) : null;
      } catch (e) {
        console.error("Failed to parse adminData:", e);
      }

      // Ensure data exists and has an 'events' array
      if (!data || typeof data !== 'object') {
        data = { events: [] };
      }
      if (!Array.isArray(data.events)) {
        data.events = [];
      }

      return data;
    }

    function saveAdminData(data) {
      localStorage.setItem('adminData', JSON.stringify(data));
    }

    // 2. Safe Append Function
    function appendEvent(newEvent) {
      // Get current valid data structure
      const adminData = getAdminData();

      // Guard check before accessing array
      if (!Array.isArray(adminData.events)) {
        adminData.events = [];
      }

      // Push new event
      adminData.events.push(newEvent);

      // Persist to storage
      saveAdminData(adminData);

      // Update UI
      renderEvents();
    }

    // 3. Form Submit Handler
    function handleFormSubmit(e) {
      e.preventDefault();

      const titleInput = document.getElementById('eventTitle');
      const dateInput = document.getElementById('eventDate');

      const newEvent = {
        id: Date.now(),
        title: titleInput.value,
        date: dateInput.value
      };

      // Call append safely
      appendEvent(newEvent);

      // Reset form
      titleInput.value = '';
      dateInput.value = '';
    }

    // 4. Render Events to Screen
    function renderEvents() {
      const listEl = document.getElementById('eventList');
      const adminData = getAdminData();

      listEl.innerHTML = '';

      if (adminData.events.length === 0) {
        listEl.innerHTML = '<li>No events found.</li>';
        return;
      }

      adminData.events.forEach(item => {
        const li = document.createElement('li');
        li.textContent = `${item.date} - ${item.title}`;
        listEl.appendChild(li);
      });
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
