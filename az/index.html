<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>James Postal Delivery - Select County</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg border border-gray-200 p-6 space-y-6">
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold text-gray-900">James Postal Delivery</h1>
      <p class="text-sm text-gray-500">Select your county to view regional delivery routes</p>
    </div>

    <!-- County Selector Form -->
    <div class="space-y-4">
      <div>
        <label for="countySelect" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">
          Select Your County
        </label>
        <select 
          id="countySelect" 
          onchange="navigateToCounty(this.value)" 
          class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 transition"
        >
          <option value="" disabled selected>-- Choose an Arizona County --</option>
          <option value="apache">Apache County</option>
          <option value="cochise">Cochise County</option>
          <option value="coconino">Coconino County</option>
          <option value="gila">Gila County</option>
          <option value="graham">Graham County</option>
          <option value="greenlee">Greenlee County</option>
          <option value="lapaz">La Paz County</option>
          <option value="maricopa">Maricopa County</option>
          <option value="mohave">Mohave County</option>
          <option value="navajo">Navajo County</option>
          <option value="pima">Pima County</option>
          <option value="pinal">Pinal County</option>
          <option value="santacruz">Santa Cruz County</option>
          <option value="yavapai">Yavapai County</option>
          <option value="yuma">Yuma County</option>
        </select>
      </div>

      <p class="text-xs text-gray-400 text-center">
        Selecting a county will automatically redirect you to the local JPD hub.
      </p>
    </div>
  </div>

  <script>
    function navigateToCounty(slug) {
      if (!slug) return;
      const baseUrl = "https://jpd.jamesallied.us/az/";
      // Constructs URL e.g., https://jpd.jamesallied.us/az/gilacounty
      window.location.href = `${baseUrl}${slug}county`;
    }
  </script>

</body>
</html>
